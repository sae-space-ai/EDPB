name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m py_compile api/index.py
      - name: Import test
        run: |
          python -c "import sys; sys.path.insert(0, 'api'); import index; print('OK:', index.ECOSYSTEM_NAME)"
      - name: Run tests
        run: pytest tests/ -v || echo "No tests yet"
